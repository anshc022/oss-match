name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the name of the check that branch protection requires on
  # main. Renaming it means updating the protection rule too.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build must not need real credentials. These placeholders only exist
      # so modules that read env at import time do not throw during the build;
      # nothing here reaches a network.
      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: build-time-placeholder-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
